name: BLS data sync

# BLS OES 每年发一版(May 参考期,次年 3-4 月发布),周频检查足够:
# 数据无变化不提交(幂等),有变化 → push → Vercel 自动部署。
# 首次引导:手动 workflow_dispatch 触发一次,把全量数据落进仓库。
on:
  schedule:
    - cron: '30 6 * * 1' # 周一:BLS 数据同步(年更数据,周检查)
    - cron: '40 9 * * *' # 每天:线上体检
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: site-ops
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync BLS data
        run: |
          npm install --no-audit --no-fund xlsx
          node scripts/sync-bls.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "JKWY01"
          git config user.email "71512658+JKWY01@users.noreply.github.com"
          git add data/bls-oes.json
          if git diff --cached --quiet; then
            echo "no data change, nothing to push"
            exit 0
          fi
          git commit -m "sync: BLS OES data [skip ci]"
          git push

      - name: IndexNow ping (optional)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        if: ${{ env.SITE_URL != '' }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then echo "no indexnow key, skip"; exit 0; fi
          for path in "" "/occupations" "/states" "/rankings/highest-protein-foods" "/occupation/registered-nurses/california"; do
            curl -s -o /dev/null -w "indexnow $path -> %{http_code}\n" \
              "https://api.indexnow.org/indexnow?url=${SITE_URL}${path}&key=${INDEXNOW_KEY}"
          done

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --search "🚨 in:title" --state open --json number --jq length)
          if [ "${OPEN:-0}" = "0" ]; then
            gh issue create \
              --title "🚨 BLS sync failed — $(date -u '+%F %T') UTC" \
              --body "自动告警:BLS 数据同步失败,站点放养中需要人工查看。
          运行记录:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          修复后请关闭本 issue。连续失败时本告警不会重复开(去重逻辑见 workflow)。" || echo "issue create failed (non-fatal)"
          else
            echo "alert issue already open, skip duplicate"
          fi

  healthcheck:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '40 9 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Health check live site
        run: node scripts/healthcheck.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --search "🚨 in:title" --state open --json number --jq length)
          if [ "${OPEN:-0}" = "0" ]; then
            gh issue create \
              --title "🚨 healthcheck failed — $(date -u '+%F %T') UTC" \
              --body "自动告警:线上体检未通过,站点放养中需要人工查看。
          运行记录:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          修复后请关闭本 issue。" || echo "issue create failed (non-fatal)"
          else
            echo "alert issue already open, skip duplicate"
          fi
